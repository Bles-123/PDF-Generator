spring.application.name=pdf-generator

# Directory (relative to working directory, or absolute) where generated
# PDFs are cached on local storage.
pdf.storage.dir=./pdf-storage

# Thymeleaf: templates are not HTML5-strict-checked here since we hand the
# rendered string to jsoup/openhtmltopdf ourselves.
spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=10MB
